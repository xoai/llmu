[package]
name = "llmu"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Lean multi-provider LLM usage, cost, quota & balance reporter (CLI + TUI)"
license = "MIT"
repository = "https://github.com/xoai/llmu"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "=4.5.4", features = ["derive"] }
crossterm = "=0.27.0"
dirs = "=5.0.1"
ratatui = "=0.26.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.10.9"
toml = "=0.8.14"
ureq = { version = "=2.9.7", features = ["json"] }
# pin: url 2.5.1+ pulls ICU idna stack that needs newer rustc
url = "=2.5.0"

[profile.release]
opt-level = "z"   # optimize for size
lto = true
codegen-units = 1
strip = true
panic = "abort"
